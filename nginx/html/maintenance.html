<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance - Al Fakhir School LMS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1A2332;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      text-align: center;
      padding: 48px;
      max-width: 480px;
    }
    .logo {
      font-size: 56px;
      font-weight: 900;
      color: #FF8C42;
      margin-bottom: 8px;
    }
    h1 { font-size: 24px; margin-bottom: 12px; color: #fff; }
    p { color: rgba(255,255,255,0.6); line-height: 1.6; font-size: 15px; }
    .badge {
      display: inline-block;
      background: #3B7FD1;
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 24px;
    }
    .contact { margin-top: 32px; font-size: 13px; color: rgba(255,255,255,0.4); }
    .contact a { color: #3B7FD1; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">AF</div>
    <div class="badge">Maintenance Mode</div>
    <h1>Sistem Sedang Diperbaiki</h1>
    <p>
      Al Fakhir School LMS sedang dalam proses pemeliharaan terjadwal.<br>
      Sistem akan kembali online dalam waktu singkat.<br><br>
      Mohon maaf atas ketidaknyamanan ini.
    </p>
    <div class="contact">
      Butuh bantuan? Hubungi: <a href="mailto:admin@alfakhirschool.id">admin@alfakhirschool.id</a>
    </div>
  </div>
</body>
</html>
