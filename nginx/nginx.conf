user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml application/json
               application/javascript;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:10m max_size=200m inactive=1h use_temp_path=off;

    upstream backend {
        server backend:3001;
        keepalive 32;
    }

    upstream web_admin {
        server web-admin:3000 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream web_guru {
        server web-guru:3002 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream web_portal {
        server web-portal:3000 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # ─── SD ───────────────────────────────────────────────
    upstream web_admin_sd  { server web-admin-sd:3000  max_fails=3 fail_timeout=10s; keepalive 8; }
    upstream web_guru_sd   { server web-guru-sd:3000   max_fails=3 fail_timeout=10s; keepalive 8; }
    upstream web_portal_sd { server web-portal-sd:3000 max_fails=3 fail_timeout=10s; keepalive 32; }

    # ─── SMP ──────────────────────────────────────────────
    upstream web_admin_smp  { server web-admin-smp:3000  max_fails=3 fail_timeout=10s; keepalive 8; }
    upstream web_guru_smp   { server web-guru-smp:3000   max_fails=3 fail_timeout=10s; keepalive 8; }
    upstream web_portal_smp { server web-portal-smp:3000 max_fails=3 fail_timeout=10s; keepalive 32; }

    # ─── SMA ──────────────────────────────────────────────
    upstream web_admin_sma  { server web-admin-sma:3000  max_fails=3 fail_timeout=10s; keepalive 8; }
    upstream web_guru_sma   { server web-guru-sma:3000   max_fails=3 fail_timeout=10s; keepalive 8; }
    upstream web_portal_sma { server web-portal-sma:3000 max_fails=3 fail_timeout=10s; keepalive 8; }

    # API Backend — HTTP (Cloudflare tunnel handles HTTPS)
    server {
        listen 80;
        server_name api.smpialfakhir.sch.id api.alfakhirschool.id _;

        client_max_body_size 20M;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location /api/auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        location /uploads/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /api/health {
            proxy_pass http://backend;
            access_log off;
        }
    }

    # Web Admin (master + per-jenjang aliases)
    server {
        listen 80;
        server_name admin.smpialfakhir.sch.id
                    admin-sd.smpialfakhir.sch.id
                    admin-smp.smpialfakhir.sch.id
                    admin-sma.smpialfakhir.sch.id;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
            proxy_pass http://web_admin;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Web Guru
    server {
        listen 80;
        server_name guru.smpialfakhir.sch.id;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
            proxy_pass http://web_guru;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Portal Ortu & Siswa
    server {
        listen 80;
        server_name portal.smpialfakhir.sch.id;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
            proxy_pass http://web_portal;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ─── SD server blocks ─────────────────────────────────
    server {
        listen 80;
        server_name admin-sd.alfakhirschool.sch.id;
        location / {
            proxy_pass http://web_admin_sd;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    server {
        listen 80;
        server_name guru-sd.alfakhirschool.sch.id;
        location / {
            proxy_pass http://web_guru_sd;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    server {
        listen 80;
        server_name portal-sd.alfakhirschool.sch.id portal-sd.smpialfakhir.sch.id;
        location /_next/static/ {
            proxy_pass http://web_portal_sd;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_cache static_cache;
            proxy_cache_valid 200 24h;
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache-Status $upstream_cache_status;
            expires 1d;
        }
        location / {
            proxy_pass http://web_portal_sd;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }
    }

    # ─── SMP server blocks ────────────────────────────────
    server {
        listen 80;
        server_name admin-smp.alfakhirschool.sch.id;
        location / {
            proxy_pass http://web_admin_smp;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    server {
        listen 80;
        server_name guru-smp.alfakhirschool.sch.id;
        location / {
            proxy_pass http://web_guru_smp;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    server {
        listen 80;
        server_name portal-smp.alfakhirschool.sch.id;
        location / {
            proxy_pass http://web_portal_smp;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ─── SMA server blocks ────────────────────────────────
    server {
        listen 80;
        server_name admin-sma.alfakhirschool.sch.id;
        location / {
            proxy_pass http://web_admin_sma;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    server {
        listen 80;
        server_name guru-sma.alfakhirschool.sch.id;
        location / {
            proxy_pass http://web_guru_sma;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    server {
        listen 80;
        server_name portal-sma.alfakhirschool.sch.id;
        location / {
            proxy_pass http://web_portal_sma;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # N8N
    server {
        listen 80;
        server_name n8n.smpialfakhir.sch.id;

        location / {
            proxy_pass http://n8n:5678;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }

    server {
        listen 80;
        server_name waha.smpialfakhir.sch.id;

        location / {
            resolver 127.0.0.11 valid=30s;
            set $waha_upstream http://waha:3000;
            proxy_pass $waha_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
