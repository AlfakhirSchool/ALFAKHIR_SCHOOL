version: '3.8'

# Local development - gunakan port 5433/6380 karena 5432/6379 sudah dipakai natively
# Backend connect ke container postgres/redis lewat docker network (internal)

services:
  postgres:
    image: postgres:14-alpine
    container_name: alfakhir-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: alfakhir_school
      POSTGRES_USER: alfakhir
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alfakhir_dev_2025}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfakhir -d alfakhir_school"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - alfakhir-network

  redis:
    image: redis:7-alpine
    container_name: alfakhir-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - alfakhir-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alfakhir-backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: alfakhir_school
      DB_USER: alfakhir
      DB_PASSWORD: ${DB_PASSWORD:-alfakhir_dev_2025}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-alfakhir-2025}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-alfakhir-2025}
      REDIS_URL: redis://redis:6379
      API_PREFIX: /api
      FRONTEND_ADMIN_URL: http://localhost:3000
      FRONTEND_GURU_URL: http://localhost:3002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - alfakhir-network

volumes:
  postgres_data:
  redis_data:

networks:
  alfakhir-network:
    driver: bridge
