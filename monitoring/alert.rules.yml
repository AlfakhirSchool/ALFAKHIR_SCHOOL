groups:
  - name: alfakhir-critical
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend Al Fakhir DOWN"
          description: "Backend tidak merespons selama 1 menit. Segera cek!"

      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL DOWN"
          description: "Database PostgreSQL tidak merespons."

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Error rate tinggi"
          description: "Backend error rate > 10% dalam 5 menit terakhir."

  - name: alfakhir-resources
    rules:
      - alert: HighCpuUsage
        expr: 100 - (avg by(instance)(irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU usage tinggi {{ $value }}%"
          description: "CPU {{ $labels.instance }} > 85% selama 10 menit."

      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Memory hampir penuh {{ $value }}%"
          description: "Memory {{ $labels.instance }} > 90%."

      - alert: DiskSpaceLow
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk hampir penuh {{ $value }}%"
          description: "Disk / pada {{ $labels.instance }} > 80%."

  - name: alfakhir-postgres
    rules:
      - alert: PostgresConnectionsHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Koneksi PostgreSQL tinggi"
          description: "Jumlah koneksi aktif: {{ $value }}"

      - alert: PostgresReplicationLag
        expr: pg_replication_lag > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Replication lag tinggi"
          description: "PostgreSQL replication lag: {{ $value }}s"
