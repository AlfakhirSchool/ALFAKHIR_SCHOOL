global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'monitor@alfakhirschool.id'
  smtp_auth_username: 'monitor@alfakhirschool.id'
  smtp_auth_password: 'GANTI_SMTP_PASSWORD'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'email-admin'
  routes:
    - match:
        severity: critical
      receiver: 'email-admin'
      repeat_interval: 30m

receivers:
  - name: 'email-admin'
    email_configs:
      - to: 'admin@alfakhirschool.id'
        subject: '[ALERT] Al Fakhir School - {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Detail: {{ .Annotations.description }}
          Status: {{ .Status }}
          Waktu: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
