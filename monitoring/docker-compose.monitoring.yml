# Jalankan: docker compose -f monitoring/docker-compose.monitoring.yml up -d
# Grafana:    http://10.10.9.73:3100  (admin / alfakhir2025)
# Prometheus: http://10.10.9.73:9090

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: alfakhir_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - alfakhir_alfakhir_net

  grafana:
    image: grafana/grafana:latest
    container_name: alfakhir_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: alfakhir2025
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3100:3000"
    depends_on:
      - prometheus
    networks:
      - alfakhir_alfakhir_net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: alfakhir_node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - alfakhir_alfakhir_net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: alfakhir_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-alfakhir}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-alfakhir_school}?sslmode=disable"
    ports:
      - "127.0.0.1:9187:9187"
    networks:
      - alfakhir_alfakhir_net

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alfakhir_alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - alfakhir_alfakhir_net

volumes:
  prometheus_data:
  grafana_data:

networks:
  alfakhir_alfakhir_net:
    external: true
