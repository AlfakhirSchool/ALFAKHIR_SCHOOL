name: Build Flutter APK

on:
  push:
    branches: [main]
    paths:
      - 'siswa_app/**'
      - 'orang_tua_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-siswa:
    name: Build Siswa APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project structure
        working-directory: siswa_app
        run: flutter create . --platforms android

      - name: Fix Kotlin version
        working-directory: siswa_app
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle || true
          sed -i "s/id 'org.jetbrains.kotlin.android' version '[^']*'/id 'org.jetbrains.kotlin.android' version '1.9.22'/" android/settings.gradle || true
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.22"/' android/build.gradle || true

      - name: Create asset dirs
        working-directory: siswa_app
        run: |
          mkdir -p assets/images assets/fonts

      - name: Flutter pub get
        working-directory: siswa_app
        run: flutter pub get

      - name: Build release APK
        working-directory: siswa_app
        run: |
          flutter build apk --release \
            --dart-define=API_URL=https://api.smpialfakhir.sch.id/api

      - name: Upload Siswa APK
        uses: actions/upload-artifact@v4
        with:
          name: alfakhir-siswa-apk
          path: siswa_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-orang-tua:
    name: Build Orang Tua APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project structure
        working-directory: orang_tua_app
        run: flutter create . --platforms android

      - name: Fix Kotlin version
        working-directory: orang_tua_app
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle || true
          sed -i "s/id 'org.jetbrains.kotlin.android' version '[^']*'/id 'org.jetbrains.kotlin.android' version '1.9.22'/" android/settings.gradle || true
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.22"/' android/build.gradle || true

      - name: Create asset dirs
        working-directory: orang_tua_app
        run: |
          mkdir -p assets/images assets/fonts

      - name: Flutter pub get
        working-directory: orang_tua_app
        run: flutter pub get

      - name: Build release APK
        working-directory: orang_tua_app
        run: |
          flutter build apk --release \
            --dart-define=API_URL=https://api.smpialfakhir.sch.id/api

      - name: Upload Orang Tua APK
        uses: actions/upload-artifact@v4
        with:
          name: alfakhir-orang-tua-apk
          path: orang_tua_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
