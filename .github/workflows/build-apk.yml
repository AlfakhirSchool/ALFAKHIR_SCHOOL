name: Build Flutter APK

on:
  push:
    branches: [main]
    paths:
      - 'siswa_app/**'
      - 'orang_tua_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-siswa:
    name: Build Siswa APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set build number
        working-directory: siswa_app
        run: |
          sed -i "s/^version:.*/version: 1.0.0+${{ github.run_number }}/" pubspec.yaml

      - name: Create asset dirs
        working-directory: siswa_app
        run: |
          mkdir -p assets/images assets/fonts

      - name: Flutter pub get
        working-directory: siswa_app
        run: flutter pub get

      - name: Generate app icon
        working-directory: siswa_app
        run: flutter pub run flutter_launcher_icons

      - name: Build release APK
        working-directory: siswa_app
        run: |
          flutter build apk --release \
            --dart-define=API_URL=https://api.smpialfakhir.sch.id/api

      - name: Upload Siswa APK
        uses: actions/upload-artifact@v4
        with:
          name: alfakhir-siswa-apk
          path: siswa_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-orang-tua:
    name: Build Orang Tua APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set build number
        working-directory: orang_tua_app
        run: |
          sed -i "s/^version:.*/version: 1.0.0+${{ github.run_number }}/" pubspec.yaml

      - name: Create asset dirs
        working-directory: orang_tua_app
        run: |
          mkdir -p assets/images assets/fonts

      - name: Flutter pub get
        working-directory: orang_tua_app
        run: flutter pub get

      - name: Generate app icon
        working-directory: orang_tua_app
        run: flutter pub run flutter_launcher_icons

      - name: Build release APK
        working-directory: orang_tua_app
        run: |
          flutter build apk --release \
            --dart-define=API_URL=https://api.smpialfakhir.sch.id/api

      - name: Upload Orang Tua APK
        uses: actions/upload-artifact@v4
        with:
          name: alfakhir-orang-tua-apk
          path: orang_tua_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: [build-siswa, build-orang-tua]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Siswa APK
        uses: actions/download-artifact@v4
        with:
          name: alfakhir-siswa-apk
          path: ./apks/siswa

      - name: Download Orang Tua APK
        uses: actions/download-artifact@v4
        with:
          name: alfakhir-orang-tua-apk
          path: ./apks/ortu

      - name: Rename APKs
        run: |
          mv ./apks/siswa/app-release.apk ./alfakhir-siswa.apk
          mv ./apks/ortu/app-release.apk ./alfakhir-ortu.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Release v${{ github.run_number }}"
          body: |
            Build otomatis dari GitHub Actions #${{ github.run_number }}

            **Download APK:**
            - 📱 [App Siswa](https://github.com/AlfakhirSchool/ALFAKHIR_SCHOOL/releases/download/v${{ github.run_number }}/alfakhir-siswa.apk)
            - 👪 [App Orang Tua](https://github.com/AlfakhirSchool/ALFAKHIR_SCHOOL/releases/download/v${{ github.run_number }}/alfakhir-ortu.apk)
          files: |
            ./alfakhir-siswa.apk
            ./alfakhir-ortu.apk
          make_latest: true
