name: Deploy ke Proxmox

on:
  push:
    branches: [main]
    paths-ignore:
      - 'siswa_app/**'
      - 'orang_tua_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: deploy-proxmox
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ke CT101 (Proxmox)
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Pull kode terbaru
        run: |
          cd /root/alfakhir
          git fetch origin main
          git reset --hard origin/main

      - name: Rebuild & restart services
        run: |
          cd /root/alfakhir
          docker compose -f docker-compose.prod.yml up -d --build --remove-orphans backend web-admin web-guru
          docker image prune -f

      - name: Cek status container
        run: |
          cd /root/alfakhir
          echo "=== Status Container ==="
          docker compose -f docker-compose.prod.yml ps
          echo ""
          echo "Deploy selesai: $(date '+%Y-%m-%d %H:%M:%S')"
