services:
  postgres:
    image: postgres:14-alpine
    container_name: alfakhir_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alfakhir_school}
      POSTGRES_USER: ${POSTGRES_USER:-alfakhir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=id_ID.UTF-8 --lc-ctype=id_ID.UTF-8"
    volumes:
      - /opt/alfakhir-data/postgres:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./backups/postgres:/backups
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alfakhir} -d ${POSTGRES_DB:-alfakhir_school}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alfakhir_net
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: alfakhir_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - /opt/alfakhir-data/redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alfakhir_net

  minio:
    image: minio/minio:latest
    container_name: alfakhir_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-alfakhir}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - /opt/alfakhir-data/minio:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - alfakhir_net

  n8n:
    image: n8nio/n8n:latest
    container_name: alfakhir_n8n
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      N8N_HOST: ${N8N_HOST:-n8n.smpialfakhir.sch.id}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOST:-n8n.smpialfakhir.sch.id}/
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-alfakhir}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      BACKEND_URL: http://backend:3001
      FCM_SERVER_KEY: ${FCM_SERVER_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    networks:
      - alfakhir_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alfakhir_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-alfakhir}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-alfakhir_school}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-alfakhir}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: alfakhir-files
      FRONTEND_ADMIN_URL: ${FRONTEND_ADMIN_URL}
      FRONTEND_GURU_URL: ${FRONTEND_GURU_URL}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook
      N8N_WEBHOOK_SISWA: https://n8n.smpialfakhir.sch.id/webhook/siswa-baru
      N8N_WEBHOOK_GURU: https://n8n.smpialfakhir.sch.id/webhook/guru-baru
      WAHA_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:-alfakhir-waha-2025}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      FONNTE_TOKEN: ${FONNTE_TOKEN:-}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-alfakhir_school}
      DB_USER: ${POSTGRES_USER:-alfakhir}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSL: "false"
      OBSERVASI_API_URL: https://dashboard-alfakhir-seven.vercel.app
      OBSERVASI_API_KEY: alfakhir_obs_int_2026
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    volumes:
      - /opt/alfakhir-data/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - alfakhir_net
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  nginx:
    image: nginx:alpine
    container_name: alfakhir_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - alfakhir_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: alfakhir_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - alfakhir_net

  waha:
    image: devlikeapro/waha
    container_name: alfakhir_waha
    restart: unless-stopped
    environment:
      WHATSAPP_API_KEY: ${WAHA_API_KEY:-alfakhir-waha-2025}
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WAHA_DASHBOARD_USER: ${WAHA_DASHBOARD_USER:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASS:-alfakhir2025}
    volumes:
      - waha_data:/app/.sessions
    ports:
      - "127.0.0.1:3003:3000"
    networks:
      - alfakhir_net

  web-admin:
    build:
      context: ./frontend/web-admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.smpialfakhir.sch.id/api}
    container_name: alfakhir_web_admin
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',(r)=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - alfakhir_net

  web-guru:
    build:
      context: ./frontend/web-guru
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.smpialfakhir.sch.id/api}
    container_name: alfakhir_web_guru
    restart: unless-stopped
    ports:
      - "3002:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',(r)=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - alfakhir_net

volumes:
  n8n_data:
  nginx_logs:
  waha_data:

networks:
  alfakhir_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
