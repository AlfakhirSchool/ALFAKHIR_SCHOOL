# Mirror prod tapi tanpa nginx/cloudflared/waha
# Pakai Dockerfile yang sama persis dengan prod
# Test build lokal sebelum deploy ke CT101

services:
  postgres:
    image: postgres:14-alpine
    container_name: alfakhir_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: alfakhir_school
      POSTGRES_USER: alfakhir
      POSTGRES_PASSWORD: alfakhir_dev_2025
    volumes:
      - postgres_local:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfakhir -d alfakhir_school"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alfakhir_local

  redis:
    image: redis:7-alpine
    container_name: alfakhir_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alfakhir_local

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alfakhir_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: alfakhir_school
      DB_USER: alfakhir
      DB_PASSWORD: alfakhir_dev_2025
      DATABASE_URL: postgres://alfakhir:alfakhir_dev_2025@postgres:5432/alfakhir_school
      JWT_SECRET: dev-jwt-secret-alfakhir-school-lms-2025
      JWT_REFRESH_SECRET: dev-refresh-secret-alfakhir-school-lms-2025
      REDIS_URL: redis://redis:6379
      N8N_WEBHOOK_SISWA: https://n8n.smpialfakhir.sch.id/webhook/siswa-baru
      N8N_WEBHOOK_GURU: https://n8n.smpialfakhir.sch.id/webhook/guru-baru
      FRONTEND_ADMIN_URL: http://localhost:3000
      FRONTEND_GURU_URL: http://localhost:3002
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - alfakhir_local

  web-admin:
    build:
      context: ./web-admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
    container_name: alfakhir_web_admin
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - alfakhir_local

  web-guru:
    build:
      context: ./web-guru
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
    container_name: alfakhir_web_guru
    restart: unless-stopped
    ports:
      - "3002:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - alfakhir_local

volumes:
  postgres_local:

networks:
  alfakhir_local:
    driver: bridge
